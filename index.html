<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090e18">
  <meta name="description" content="Explorez le système solaire en 3D, de notre étoile aux mondes lointains.">
  <title>Hackathon NASA — Atlas du système solaire</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('nasa-atlas-theme')==='day'?'day':'night'}catch{document.documentElement.dataset.theme='night'}</script>
  <link rel="stylesheet" href="./styles.css?v=7">
  <link rel="stylesheet" href="./live.css?v=1">
  <link rel="stylesheet" href="./premium.css?v=8">
  <link rel="stylesheet" href="./theme.css?v=1">
  <link rel="stylesheet" href="./compact.css?v=3">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js"}}</script>
</head>
<body class="atlas-page" data-mode="overview">
  <div id="scene" aria-label="Vue interactive du système solaire"></div>
  <div id="planet-labels" aria-hidden="false"></div>

  <header class="topbar">
    <a class="identity" href="#" id="brand-home" aria-label="Retour à la vue d’ensemble">
      <span class="identity-icon"><span></span></span>
      <span class="identity-copy"><strong>Atlas</strong><small>NASA</small></span>
    </a>
    <span class="topbar-hint">GLISSER POUR TOURNER <span>·</span> PINCER OU DÉFILER POUR ZOOMER</span>
    <div class="header-actions"><button class="header-language" data-language-toggle type="button" aria-label="Switch language">EN</button><button class="theme-toggle" data-theme-toggle type="button" aria-label="Passer en mode jour"><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 13.1A8.8 8.8 0 0 1 10.9 3.3 8.9 8.9 0 1 0 20.7 13.1Z"/></svg></button></div>
  </header>

  <main>
    <nav class="destinations glass" aria-label="Choisir un corps céleste">
      <div id="planet-navigation" class="planet-navigation"></div>
    </nav>

    <aside class="details glass" id="details" aria-live="polite" hidden>
      <div class="detail-top"><span id="detail-category">EXPLORATION</span><button id="details-toggle" type="button" aria-label="Réduire les détails" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
      <div class="detail-identity"><span class="detail-orb" id="detail-orb"></span><div><h2 id="detail-name">Système solaire</h2><p id="detail-subtitle">Un voisinage à explorer</p></div></div>
      <div class="detail-expanded">
        <div id="detail-actions" class="detail-actions"></div>
        <section id="live-data" class="live-data" aria-live="polite"></section>
      </div>
    </aside>
  </main>

  <div class="imagery-credit" id="imagery-credit" hidden></div>
  <div class="gesture-hint" id="gesture-hint" hidden>GLISSEZ POUR VOUS DÉPLACER <span>·</span> PINCEZ OU DÉFILEZ POUR ZOOMER</div>

  <footer class="toolbar glass" aria-label="Commandes de l’exploration">
    <button class="tool-button info-button" id="info-toggle" type="button" aria-label="Afficher les détails" aria-expanded="false" hidden>Infos</button>
    <button class="overview-button" id="overview-button" type="button">◎ <span>Vue globale</span></button>
  </footer>

  <div class="loading" id="loading" role="status"><span class="loading-orbit"></span><span>Chargement…</span></div>
  <div class="error-screen" id="error-screen" role="alert" hidden><strong>La vue 3D ne peut pas démarrer.</strong><p id="error-message">Rechargez la page pour réessayer.</p></div>
  <script type="module" src="./theme.js?v=2"></script>
  <script type="module" src="./app.js?v=16"></script>
</body>
</html>
